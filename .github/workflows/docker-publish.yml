name: Validate and deliberately publish Docker images

# Plan validates exact normal-release syntax after the trigger prefilter.
"on":
  pull_request:
    branches: [master, "codex/ct102-stack-*"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [master]
    # GitHub's + repeats the preceding digit class; v1.2.3 matches this glob.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#filter-pattern-cheat-sheet
    # This is a numeric prefilter; plan rejects leading zeros and suffixes.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish_test_image:
        description: Publish the tested image to the separate test package
        type: boolean
        default: false
        required: true
      publish_latest:
        description: Deliberately publish the tested master candidate to the application package and latest
        type: boolean
        default: false
        required: true
      test_label:
        description: Candidate/test label (1..32 lowercase letters/digits and internal hyphens)
        type: string
        default: ""
        required: false

permissions:
  contents: read

# Only superseded PR runs are cancelled. Landings/releases/manual runs are distinct.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Validation must remain local even when PostHog upload credentials exist.
  POSTHOG_UPLOAD_REQUIRED: 'false'

jobs:
  ci-required:
    # Start the protected context immediately, including repeated ready events at
    # the same SHA. A dependent aggregate would leave an older success visible.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'validation-deferred' || 'ci-required' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
    env:
      # Job env cannot use the runner context. /tmp is outside Docker's context;
      # GitHub-hosted jobs have isolated filesystems, including this proof file.
      VALIDATION_PLAN_PATH: /tmp/vexxx-validation-plan-${{ github.run_id }}-${{ github.run_attempt }}.json
      PACKAGING_EVIDENCE_PATH: /tmp/pr-packaging.json
      # Freeze the declared variable inputs for both proof and Docker invocation.
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
      POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      local_ref: ${{ steps.plan.outputs.local_ref }}
      image_ref: ${{ steps.plan.outputs.image_ref }}
      sha_ref: ${{ steps.plan.outputs.sha_ref }}
      latest_ref: ${{ steps.plan.outputs.latest_ref }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication policy and packaging tests
        id: policy_tests
        run: |
          python3 -m unittest discover -s scripts -p test_image_publication_policy.py
          python3 -m unittest discover -s scripts -p test_check_intel_runtime.py
          python3 -m unittest discover -s scripts -p test_reuse_master_validation.py
          python3 -m unittest discover -s scripts -p test_reuse_pr_packaging.py
      - name: Classify changed inputs and deliberate publication
        id: plan
        run: python3 scripts/image_publication_policy.py
      - if: steps.plan.outputs.build_image == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify PR packaging evidence
        id: packaging_reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reuse_pr_packaging.py
      - name: Verify exact-master validation evidence
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_BACKEND: ${{ steps.plan.outputs.backend }}
          REQUIRED_FRONTEND: ${{ steps.plan.outputs.frontend }}
          REQUIRED_PYTHON: ${{ steps.plan.outputs.python }}
        run: python3 scripts/reuse_master_validation.py

      - if: steps.reuse.outputs.execute_backend == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - if: steps.reuse.outputs.execute_frontend == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.4
      - name: Configure pnpm store before restoring cache
        if: steps.reuse.outputs.execute_frontend == 'true'
        # Keep setup-node's cache path aligned with make pre-ui in CI.
        run: pnpm config set store-dir ~/.pnpm-store
      - if: steps.reuse.outputs.execute_frontend == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/v2.5/pnpm-lock.yaml
      - name: Install media tools
        if: steps.reuse.outputs.execute_backend == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-tools
      - name: Install frozen frontend dependencies and generate operations
        id: frontend_generate
        if: steps.reuse.outputs.execute_frontend == 'true'
        run: make pre-ui generate-ui
      - name: Generate backend and login locales
        id: backend_generate
        if: steps.reuse.outputs.execute_backend == 'true'
        run: make generate-backend generate-login-locale
      - name: Go unit and integration tests
        id: backend_test
        if: steps.reuse.outputs.execute_backend == 'true'
        # Keep build/module caches, but execute tests again against this tree.
        run: |
          go test -count=1 ./...
          go test -count=1 -tags 'sqlite_stat4 sqlite_math_functions integration' ./...
      - name: Frontend tests and type check
        id: frontend_test
        if: steps.reuse.outputs.execute_frontend == 'true'
        working-directory: ui/v2.5
        run: |
          pnpm test
          pnpm run check
      - name: Production frontend compilation
        id: frontend_compile
        env:
          BUILD_DATE: ${{ steps.plan.outputs.build_date }}
          GITHASH: ${{ github.sha }}
          STASH_VERSION: ${{ steps.plan.outputs.version }}
        if: steps.reuse.outputs.execute_frontend == 'true' && steps.plan.outputs.build_image != 'true'
        # Image candidates compile once in Docker with release maps/metadata.
        run: make ui-only
      - name: Production backend compilation
        id: backend_compile
        env:
          BUILD_DATE: ${{ steps.plan.outputs.build_date }}
          GITHASH: ${{ github.sha }}
          STASH_VERSION: ${{ steps.plan.outputs.version }}
        if: steps.reuse.outputs.execute_backend == 'true' && steps.plan.outputs.build_image != 'true'
        # When frontend is selected this embeds its real production assets.
        run: make flags-release flags-pie stash
      - name: Python regression tests
        id: python_test
        if: steps.reuse.outputs.execute_python == 'true'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          if test -d scripts/gpu_generation; then
            python3 -m unittest discover -s scripts/gpu_generation -p 'test_*.py'
          fi

      - name: Build Linux amd64 image locally
        id: image_build
        if: steps.packaging_reuse.outputs.execute_image == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build/x86_64/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.plan.outputs.local_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
          build-args: |
            GITHASH=${{ github.sha }}
            STASH_VERSION=${{ steps.plan.outputs.version }}
            BUILD_DATE=${{ steps.plan.outputs.build_date }}
            POSTHOG_UPLOAD_REQUIRED=${{ steps.plan.outputs.publish }}
            POSTHOG_CLI_PROJECT_ID=${{ env.POSTHOG_CLI_PROJECT_ID }}
            POSTHOG_CLI_HOST=${{ env.POSTHOG_CLI_HOST }}
            VITE_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ env.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            VITE_PUBLIC_POSTHOG_HOST=${{ env.VITE_PUBLIC_POSTHOG_HOST }}
            GITHUB_ACTIONS=true
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SERVER_URL=${{ github.server_url }}
          secrets: |
            POSTHOG_CLI_API_KEY=${{ steps.plan.outputs.publish == 'true' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && (inputs.publish_test_image || inputs.publish_latest))) && secrets.POSTHOG_CLI_API_KEY || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        id: image_smoke
        if: steps.packaging_reuse.outputs.execute_image == 'true'
        env:
          LOCAL_IMAGE: ${{ steps.plan.outputs.local_ref }}
        run: |
          docker image inspect --format '{{ .Id }}' "$LOCAL_IMAGE" > image.id
          docker run --detach --name vexxx-smoke \
            --publish 127.0.0.1:9999:9999 \
            --env STASH_HOST=0.0.0.0 \
            "$(cat image.id)"
          trap 'docker logs vexxx-smoke; docker rm --force vexxx-smoke' EXIT
          curl --fail --silent --show-error --retry 30 \
            --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:9999/ > /dev/null
      - name: Save the exact smoke-tested image
        if: steps.plan.outputs.publish == 'true'
        env:
          LOCAL_IMAGE: ${{ steps.plan.outputs.local_ref }}
        run: |
          docker save "$LOCAL_IMAGE" --output image.tar
          sha256sum image.tar image.id > image.tar.sha256
      - name: Transfer tested image to publication job
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image
          path: |
            image.tar
            image.tar.sha256
            image.id
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # Always verify actual step outcomes, including skipped work after a failure.
      - name: Verify every selected obligation
        id: required_gate
        if: always()
        env:
          PLAN_RESULT: ${{ steps.policy_tests.outcome == 'success' && steps.plan.outcome == 'success' && steps.reuse.outcome == 'success' && steps.packaging_reuse.outcome == 'success' && 'success' || 'failure' }}
          IMAGE_RESULT: ${{ steps.image_build.outcome == 'success' && steps.image_smoke.outcome == 'success' && 'success' || (steps.image_build.outcome == 'skipped' && steps.image_smoke.outcome == 'skipped' && 'skipped' || 'failure') }}
          RUN_TESTS: ${{ steps.reuse.outputs.execute_tests }}
          REQUIRED_TESTS: ${{ steps.plan.outputs.run_tests }}
          DRAFT_EVENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          EXPECTED_SHA: ${{ github.sha }}
          REUSE_ALLOWED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag') }}
          REUSE_RUN: ${{ steps.reuse.outputs.reuse_run }}
          REUSE_ATTEMPT: ${{ steps.reuse.outputs.reuse_attempt }}
          REUSE_REVISION: ${{ steps.reuse.outputs.reuse_revision }}
          REUSE_WORKFLOW_DIGEST: ${{ steps.reuse.outputs.reuse_workflow_digest }}
          BUILD_IMAGE: ${{ steps.plan.outputs.build_image }}
          PACKAGING_REUSED: ${{ steps.packaging_reuse.outputs.reused }}
          EXECUTE_IMAGE: ${{ steps.packaging_reuse.outputs.execute_image }}
          PACKAGING_REUSE_ALLOWED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.plan.outputs.publish == 'false' }}
          PACKAGING_SOURCE_RUN: ${{ steps.packaging_reuse.outputs.source_run }}
          PACKAGING_SOURCE_ATTEMPT: ${{ steps.packaging_reuse.outputs.source_attempt }}
          PACKAGING_CANDIDATE: ${{ steps.packaging_reuse.outputs.candidate }}
          PACKAGING_LANDED: ${{ steps.packaging_reuse.outputs.landed }}
          PACKAGING_TREE: ${{ steps.packaging_reuse.outputs.tree }}
          EXPECTED_TREE: ${{ steps.plan.outputs.tree }}
          PACKAGING_WORKFLOW_DIGEST: ${{ steps.packaging_reuse.outputs.workflow_digest }}
          PACKAGING_INPUT_DIGEST: ${{ steps.packaging_reuse.outputs.input_digest }}
          DEFERRED: ${{ steps.plan.outputs.deferred }}
          BACKEND: ${{ steps.reuse.outputs.execute_backend }}
          BACKEND_GENERATE_RESULT: ${{ steps.backend_generate.outcome }}
          BACKEND_COMPILE_RESULT: ${{ steps.backend_compile.outcome }}
          BACKEND_RESULT: ${{ steps.backend_test.outcome }}
          REQUIRED_BACKEND: ${{ steps.plan.outputs.backend }}
          REUSED_BACKEND: ${{ steps.reuse.outputs.reused_backend }}
          FRONTEND: ${{ steps.reuse.outputs.execute_frontend }}
          FRONTEND_GENERATE_RESULT: ${{ steps.frontend_generate.outcome }}
          FRONTEND_COMPILE_RESULT: ${{ steps.frontend_compile.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend_test.outcome }}
          REQUIRED_FRONTEND: ${{ steps.plan.outputs.frontend }}
          REUSED_FRONTEND: ${{ steps.reuse.outputs.reused_frontend }}
          PYTHON: ${{ steps.reuse.outputs.execute_python }}
          PYTHON_RESULT: ${{ steps.python_test.outcome }}
          REQUIRED_PYTHON: ${{ steps.plan.outputs.python }}
          REUSED_PYTHON: ${{ steps.reuse.outputs.reused_python }}
        run: |
          python3 - <<'PYCODE'
          import os
          import re
          from pathlib import Path
          e = os.environ
          errors = []
          if e['PLAN_RESULT'] != 'success':
              errors.append('Planner did not succeed')
          draft = e['DRAFT_EVENT'] == 'true'
          if e['DRAFT_EVENT'] not in ('true', 'false') or e['DEFERRED'] != ('true' if draft else 'false'):
              errors.append('Draft event does not match planner deferral')
          reused = False
          for domain in ('BACKEND', 'FRONTEND', 'PYTHON'):
              values = [e[domain], e['REQUIRED_' + domain], e['REUSED_' + domain]]
              if any(value not in ('true', 'false') for value in values):
                  errors.append('Invalid domain coverage: ' + domain)
                  continue
              execute, required, reuse = [value == 'true' for value in values]
              if required != (execute or reuse) or (execute and reuse):
                  errors.append('Missing or conflicting coverage: ' + domain)
              if e[domain + '_RESULT'] != ('success' if execute else 'skipped'):
                  errors.append('Unexpected test step outcome: ' + domain)
              if domain != 'PYTHON':
                  if e[domain + '_GENERATE_RESULT'] != ('success' if execute else 'skipped'):
                      errors.append('Unexpected generation outcome: ' + domain)
                  compile_selected = execute and e['BUILD_IMAGE'] == 'false'
                  if e[domain + '_COMPILE_RESULT'] != ('success' if compile_selected else 'skipped'):
                      errors.append('Unexpected production compile outcome: ' + domain)
              reused |= reuse
              if draft and (execute or required or reuse):
                  errors.append('Draft must defer substantive checks')
          if reused and (e['REUSE_ALLOWED'] != 'true' or not re.fullmatch(r'[1-9][0-9]*', e['REUSE_RUN']) or
                         not re.fullmatch(r'[1-9][0-9]*', e['REUSE_ATTEMPT']) or
                         e['REUSE_REVISION'] != e['EXPECTED_SHA'] or
                         not re.fullmatch(r'[0-9a-f]{64}', e['REUSE_WORKFLOW_DIGEST'])):
              errors.append('Missing exact workflow/source proof')
          required_groups = [e['REQUIRED_' + key] for key in ('BACKEND', 'FRONTEND', 'PYTHON')]
          if e['REQUIRED_TESTS'] not in ('true', 'false') or (e['REQUIRED_TESTS'] == 'true') != ('true' in required_groups):
              errors.append('Required tests do not match planned domains')
          if draft and e['BUILD_IMAGE'] != 'false':
              errors.append('Draft must defer image checks')
          groups = [e[key] for key in ('BACKEND', 'FRONTEND', 'PYTHON')]
          if any(value not in ('true', 'false') for value in groups):
              errors.append('Invalid planner domain')
          elif e['RUN_TESTS'] not in ('true', 'false') or (e['RUN_TESTS'] == 'true') != ('true' in groups):
              errors.append('Test obligation does not match selected domains')
          packaging_reused = e['PACKAGING_REUSED'] == 'true'
          if (e['PACKAGING_REUSED'] not in ('true', 'false') or e['EXECUTE_IMAGE'] not in ('true', 'false')
              or e['BUILD_IMAGE'] not in ('true', 'false')):
              errors.append('Invalid packaging coverage')
          if packaging_reused and (
              e['PACKAGING_REUSE_ALLOWED'] != 'true' or e['BUILD_IMAGE'] != 'true' or
              not re.fullmatch(r'[1-9][0-9]*', e['PACKAGING_SOURCE_RUN']) or
              not re.fullmatch(r'[1-9][0-9]*', e['PACKAGING_SOURCE_ATTEMPT']) or
              not re.fullmatch(r'[0-9a-f]{40}', e['PACKAGING_CANDIDATE']) or
              e['PACKAGING_LANDED'] != e['EXPECTED_SHA'] or
              e['PACKAGING_TREE'] != e['EXPECTED_TREE'] or
              not re.fullmatch(r'[0-9a-f]{40}', e['PACKAGING_TREE']) or
              not re.fullmatch(r'[0-9a-f]{64}', e['PACKAGING_WORKFLOW_DIGEST']) or
              not re.fullmatch(r'[0-9a-f]{64}', e['PACKAGING_INPUT_DIGEST'])):
              errors.append('Missing equivalent PR packaging/source proof')
          if (e['BUILD_IMAGE'] == 'true') != ((e['EXECUTE_IMAGE'] == 'true') or packaging_reused) or (
              e['EXECUTE_IMAGE'] == 'true' and packaging_reused):
              errors.append('Missing or conflicting packaging coverage')
          for selected, result in [('EXECUTE_IMAGE', 'IMAGE_RESULT')]:
              if e[selected] not in ('true', 'false'):
                  errors.append('Invalid planner obligation: ' + selected)
              elif e[result] != ('success' if e[selected] == 'true' else 'skipped'):
                  errors.append(selected + ': unexpected job result ' + e[result])
          with Path(e['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('\n\n' + (
              '\n'.join(errors) if errors else (
                  'Draft: validation deferred. This informational context is not ci-required; ready-for-review starts required validation.'
                  if draft else 'All selected validation obligations passed (executed, proven exact-master tests, or verified equivalent PR packaging).')))
          if errors:
              raise SystemExit('\n'.join(errors))
          PYCODE

      # Proof includes a GitHub-signed receipt bound to its hash, never an image.
      - name: Record PR packaging evidence
        id: packaging_record
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
          steps.plan.outputs.build_image == 'true' && steps.required_gate.outcome == 'success'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_METADATA: ${{ steps.image_build.outputs.metadata }}
        run: python3 scripts/reuse_pr_packaging.py record
      - name: Save PR packaging evidence
        if: steps.packaging_record.outputs.recorded == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-packaging-${{ github.run_attempt }}
          path: ${{ env.PACKAGING_EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: ci-required
    # Defense in depth: PR/master events never receive a publishing job token.
    if: >-
      needs.ci-required.result == 'success' && needs.ci-required.outputs.publish == 'true' &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && (inputs.publish_test_image || inputs.publish_latest)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      packages: write
    steps:
      # No checkout or execution of repository scripts with the write token.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-image
      - name: Load and verify tested source identity
        env:
          LOCAL_IMAGE: ${{ needs.ci-required.outputs.local_ref }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.ci-required.outputs.version }}
        run: |
          sha256sum --check image.tar.sha256
          docker load --input image.tar
          test "$(docker image inspect --format '{{ .Id }}' "$LOCAL_IMAGE")" = "$(cat image.id)"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$LOCAL_IMAGE")" = "$EXPECTED_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$LOCAL_IMAGE")" = "$EXPECTED_VERSION"
          test "$(docker image inspect --format '{{ .Os }}/{{ .Architecture }}' "$LOCAL_IMAGE")" = 'linux/amd64'
      - name: Log in to GHCR for deliberate publication
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        env:
          LOCAL_IMAGE: ${{ needs.ci-required.outputs.local_ref }}
          IMAGE_REF: ${{ needs.ci-required.outputs.image_ref }}
          SHA_REF: ${{ needs.ci-required.outputs.sha_ref }}
          LATEST_REF: ${{ needs.ci-required.outputs.latest_ref }}
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE_REF"
          docker push "$IMAGE_REF"
          if test -n "$SHA_REF"; then
            docker tag "$LOCAL_IMAGE" "$SHA_REF"
            docker push "$SHA_REF"
          fi
          if test -n "$LATEST_REF"; then
            docker tag "$LOCAL_IMAGE" "$LATEST_REF"
            docker push "$LATEST_REF"
          fi
          {
            echo "Published tested candidate: $IMAGE_REF"
            if test -n "$LATEST_REF"; then echo "Compose reference: $LATEST_REF"; fi
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$LOCAL_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
