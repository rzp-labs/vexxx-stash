# CI-based SonarScanner configuration; see docs/SONAR_COVERAGE.md before activation.
sonar.projectKey=rzp-labs_vexxx-stash
sonar.organization=rzp-labs
sonar.sourceEncoding=UTF-8

# Generator outputs, dependency/build directories and scoped binary asset patterns.
# The project uses whole-repository scope; source/test classification is server-side.
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  ui/v2.5/build/**,\
  ui/login/locales/**,\
  internal/api/generated_exec.go,\
  internal/api/generated_models.go,\
  internal/api/loaders/*_gen.go,\
  pkg/stashbox/graphql/generated_client.go,\
  pkg/stashbox/graphql/generated_models.go,\
  pkg/models/mocks/*ReaderWriter.go,\
  ui/v2.5/src/core/generated-graphql.ts,\
  docs/readme_assets/*.png,\
  icon.png,\
  internal/desktop/icon_windows.syso,\
  internal/static/performer/*.png,\
  internal/static/performer_male/*.png,\
  scripts/macos-bundle/Contents/Resources/*.icns,\
  scripts/*.png,\
  ui/v2.5/public/*.png,\
  ui/v2.5/public/*.ico,\
  ui/v2.5/public/fonts/poppins/*.ttf

# Native Go profiles and LCOV are different formats; do not convert to generic XML.
sonar.go.coverage.reportPaths=dist/coverage/go-unit.out,dist/coverage/go-integration.out
sonar.javascript.lcov.reportPaths=dist/coverage/frontend/lcov.info
