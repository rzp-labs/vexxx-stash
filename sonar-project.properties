# CI-based SonarScanner configuration; see docs/SONAR_COVERAGE.md before activation.
sonar.projectKey=rzp-labs_vexxx-stash
sonar.organization=rzp-labs
sonar.sourceEncoding=UTF-8
sonar.sources=cmd,internal,pkg,ui,scripts,graphql,docker,.github,tools.go
sonar.tests=cmd,internal,pkg,ui/v2.5,scripts

# Tests and their hand-written support stay in the test scope, not coverage LOC.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.mjs,**/test_*.py,ui/v2.5/src/test/**,**/testdata/**,scripts/test_db_generator/**,pkg/models/mocks/database.go,pkg/models/mocks/query.go

# Exact generator outputs and dependency/build/cache directories only.
# Test inclusions are automatically excluded from the source scope by Sonar.
sonar.exclusions=**/node_modules/**,**/vendor/**,ui/v2.5/build/**,ui/login/locales/**,internal/api/generated_exec.go,internal/api/generated_models.go,internal/api/loaders/*_gen.go,pkg/stashbox/graphql/generated_client.go,pkg/stashbox/graphql/generated_models.go,pkg/models/mocks/*ReaderWriter.go,ui/v2.5/src/core/generated-graphql.ts
sonar.test.exclusions=**/node_modules/**,**/vendor/**,ui/v2.5/build/**,ui/v2.5/coverage/**

# Native Go profiles and LCOV are different formats; do not convert to generic XML.
sonar.go.coverage.reportPaths=dist/coverage/go-unit.out,dist/coverage/go-integration.out
sonar.javascript.lcov.reportPaths=dist/coverage/frontend/lcov.info
