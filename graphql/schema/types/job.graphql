enum JobStatus {
  READY
  RUNNING
  FINISHED
  STOPPING
  CANCELLED
  FAILED
}

type Job {
  id: ID!
  status: JobStatus!
  subTasks: [String!]
  description: String!
  progress: Float
  "Reported work units processed, not successful tasks. Null for percentage-only jobs."
  processed: Int64
  "Current total work units. May change; null until a positive total is defined."
  total: Int64
  startTime: Time
  endTime: Time
  addTime: Time!
  error: String
}

input FindJobInput {
  id: ID!
}

enum JobStatusUpdateType {
  ADD
  REMOVE
  UPDATE
}

type JobStatusUpdate {
  type: JobStatusUpdateType!
  job: Job!
}
